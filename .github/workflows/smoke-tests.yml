name: Smoke Tests

on:
  repository_dispatch:
    types: [run-smoke-tests]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [ dev, prod ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve environment URLs
        id: env
        run: |
          ENV="${{ github.event.client_payload.environment || github.event.inputs.environment || 'dev' }}"
          if [ "$ENV" = "prod" ]; then
            echo "backend_url=${{ secrets.SMOKE_BACKEND_URL_PROD }}" >> $GITHUB_OUTPUT
            echo "frontend_url=${{ secrets.SMOKE_FRONTEND_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "backend_url=${{ secrets.SMOKE_BACKEND_URL_DEV }}" >> $GITHUB_OUTPUT
            echo "frontend_url=${{ secrets.SMOKE_FRONTEND_URL_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Run backend health check
        env:
          BACKEND_URL: ${{ steps.env.outputs.backend_url }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "Backend URL not set"; exit 1; fi
          echo "Checking $BACKEND_URL/health"
          status=$(curl -s -o /dev/stderr -w "%{http_code}" "$BACKEND_URL/health" || true)
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then exit 1; fi

      - name: Run frontend smoke check
        env:
          FRONTEND_URL: ${{ steps.env.outputs.frontend_url }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then echo "Frontend URL not set"; exit 1; fi
          status=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || true)
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then exit 1; fi

      - name: Report success
        run: echo "Smoke tests passed"
