name: Promote Dev -> Prod

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment to promote to'
        required: true
        default: 'prod'

permissions:
  contents: read
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy for production
        if: ${{ github.event.inputs.target == 'prod' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Render secrets not configured"; exit 1
          fi
          curl -X POST -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -d '{ "clearCache": true }' \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys

      - name: Wait for a short period for deploy to start
        run: sleep 10

      - name: Trigger smoke tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"run-smoke-tests","client_payload":{"target":"${{ github.event.inputs.target }}"}}'
