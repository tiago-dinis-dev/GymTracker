services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: gymtracker,gymtracker_ai
    volumes:
      - gymtracker-pg-data:/var/lib/postgresql/data
      - ../deployment/scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/backend.dev.Dockerfile
    working_dir: /workspace
    ports:
      - "5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__DefaultConnection: "${DEFAULT_CONNECTION:-Host=postgres;Port=5432;Database=gymtracker;Username=postgres;Password=postgres}"
      ConnectionStrings__DefaultConnectionAI: "${DEFAULT_CONNECTION_AI:-Host=postgres;Port=5432;Database=gymtracker_ai;Username=postgres;Password=postgres}"
      Jwt__Key: "${JWT__KEY:-change-me-local-dev}"
      Jwt__Issuer: "${JWT__ISSUER:-GymTracker}"
      Jwt__Audience: "${JWT__AUDIENCE:-GymTracker}"
      FitnessAgent__GitHubToken: "${FITNESS_AGENT__GITHUBTOKEN:-ollama}"
      FitnessAgent__ModelId: "${FITNESS_AGENT__MODELID:-qwen2.5:7b}"
      FitnessAgent__Endpoint: "${FITNESS_AGENT__ENDPOINT:-http://ollama:11434}"
    volumes:
      - ..:/workspace
      - nuget-packages:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.dev.Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: "${VITE_API_PROXY_TARGET:-http://backend:8080}"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ..:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  gymtracker-pg-data:
  ollama-data:
  nuget-packages:
  frontend-node-modules:
