services:
  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    ports:
      - "5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${DEFAULT_CONNECTION:-Data Source=/data/gymtracker.db}"
      ConnectionStrings__DefaultConnectionAI: "${DEFAULT_CONNECTION_AI:-Data Source=/data/gymtracker_ai.db}"
      Jwt__Key: "${JWT__KEY:-change-me-before-prod}"
      Jwt__Issuer: "${JWT__ISSUER:-GymTracker}"
      Jwt__Audience: "${JWT__AUDIENCE:-GymTracker}"
      FitnessAgent__ApiKey: "${FITNESS_AGENT__APIKEY}"
      FitnessAgent__ModelId: "${FITNESS_AGENT__MODELID:-gemma4:31b-cloud}"
      FitnessAgent__Endpoint: "${FITNESS_AGENT__ENDPOINT:-https://ollama.com/v1}"
    volumes:
      - gymtracker-data:/data

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  gymtracker-data:
